apiVersion: v1
kind: Namespace
metadata:
  name: shuttle-apps

---

apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: shuttle-apps
spec:
  type: ExternalName
  externalName: host.docker.internal # Points to your laptop/host
  ports:
    - port: 9011
      targetPort: 9011
      protocol: TCP